<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Installable to a home screen, and it opens without a network: `sw.js` is
         built from the real bundle (scripts/sw-plugin.mjs) and precaches the shell.
         Nothing is ever synced — the save is local and there is no server. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Portrait, mobile-first: no zoom, safe-area aware, dark chrome. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141417" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TinyDecklings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
